name: Build e Publicar Release (Windows)

# Dispara sempre que uma tag de versao "vX.Y.Z" for enviada ao repositorio.
# Fluxo de atualizacao:
#   1. git tag v2.1.0 && git push origin v2.1.0
#   2. Este workflow builda o .exe (PyInstaller) numa maquina Windows do GitHub,
#      gera tambem o instalador unico (Inno Setup) e publica os dois no Release:
#        - Localizador-Windows.zip   -> usado pelo auto-update (app/updater.py)
#        - LocalizadorSetup.exe      -> instalador unico p/ instalar em PCs novos
#   3. Os apps ja instalados detectam a nova versao no proximo start e se
#      atualizam sozinhos baixando o .zip.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build do executavel (PyInstaller)
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "Localizador" `
            --icon "app/assets/icon.ico" `
            --add-data "data;data" `
            --add-data "app/assets;app/assets" `
            --hidden-import "PySide6" `
            --hidden-import "fitz" `
            --hidden-import "rapidfuzz" `
            app/main.py

      - name: Compactar build (usado pelo auto-update)
        run: |
          Compress-Archive -Path "dist/Localizador/*" -DestinationPath "Localizador-Windows.zip"

      - name: Instalar Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Gerar instalador unico (LocalizadorSetup.exe)
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer.iss

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Localizador-Windows.zip
            dist_installer/LocalizadorSetup.exe
          generate_release_notes: true
